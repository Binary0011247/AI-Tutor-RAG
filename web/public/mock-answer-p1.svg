  <text x="72" y="130" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#1a2744">Q2</text>
  <text x="72" y="168" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">Osmosis is the movement of water from a dilute</text>
  <text x="72" y="198" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">solution to a concentrated one through a membrane.</text>
  <text x="72" y="228" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">Example: raisins swelling in water.</text>
  <text x="72" y="340" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#1a2744">Q11 (a)</text>
  <text x="72" y="378" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">KE = 1/2 m v^2 = 0.5 * 2.0 * 16 = 16 J</text>
  <text x="72" y="530" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#1a2744">Q11 (b)</text>
  <text x="72" y="568" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">F = 6.0 N, t = 3.0 s. a = F/m = 3 m/s^2.</text>
  <text x="72" y="598" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">v = u + at = 4 + 9 = 13 m/s. Work = Fs.</text>
  <text x="72" y="628" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">This equals dKE as shown on the next page.</text>
</svg>
