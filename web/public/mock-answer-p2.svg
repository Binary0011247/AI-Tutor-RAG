  <text x="72" y="138" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">dKE = 0.5 * 2 * (169 - 16) = 153 J.</text>
  <text x="72" y="168" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">Work = 6 * 25.5 = 153 J. So work equals dKE.</text>
  <text x="72" y="198" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#1a2744">Final speed = 13 m/s.</text>
